<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Jelajahi dan cari tautan publik berdasarkan topik.">
    <title>Tautan | PPM Tools</title>
    <link rel="stylesheet" href="/css/apbd.css?v=28">
    <script src="/js/link-directory.js?v=7" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="PPM Tools">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span><strong>PPM Tools</strong><small>Portal data publik</small></span>
      </a>
      <nav class="public-navigation" aria-label="Navigasi publik">
        <a class="button button-secondary" href="/">Dashboard</a>
        <a class="button button-secondary" href="/tagging">Tagging</a>
        <a class="button button-secondary" href="/realisasi">Realisasi dan Capaian</a>
        <a class="button button-secondary" href="/tautan" aria-current="page">Tautan</a>
        <a class="button button-secondary" href="/perbandingan-anggaran">Perbandingan Anggaran</a>
        <a class="button button-secondary" href="/login">Admin</a>
      </nav>
    </header>
    <main class="page-shell">
      <section class="page-heading">
        <p class="link-breadcrumb"><span id="link-breadcrumb"></span></p>
        <h1 id="link-page-title">Topik dan Tautan</h1>
        <p id="link-page-description" class="page-description"></p>
        <aside id="link-summary-panel" class="summary-panel link-summary-panel"
          aria-labelledby="link-summary-title" hidden>
          <div class="summary-heading">
            <h2 id="link-summary-title">Ringkasan Tautan</h2>
          </div>
          <div id="link-summary" class="summary-count-row" aria-live="polite"></div>
        </aside>
        <form id="link-search-form" class="search-form link-search-form" role="search">
          <label class="visually-hidden" for="link-search">Cari tautan</label>
          <input id="link-search" class="text-control" type="search"
            placeholder="Cari topik, judul, deskripsi, atau tag" autocomplete="off">
          <button class="button button-primary" type="submit">Cari</button>
          <button id="link-search-clear" class="button button-secondary" type="button" hidden>Hapus</button>
        </form>
        <p id="link-directory-status" class="helper-text" role="status">Memuat tautan...</p>
      </section>
      <section id="link-topics" class="link-topic-grid" aria-label="Daftar topik"></section>
      <section id="link-cards" class="link-card-grid" aria-label="Daftar tautan"></section>
      <nav id="link-pagination" class="pagination-controls" aria-label="Halaman daftar tautan" hidden>
        <span id="link-page-indicator" class="helper-text"></span>
        <div class="page-navigation">
          <button id="link-previous" class="button button-secondary" type="button" disabled>Sebelumnya</button>
          <button id="link-next" class="button button-secondary" type="button" disabled>Berikutnya</button>
        </div>
      </nav>
    </main>
    <footer class="site-footer">Tautan publik PPM Tools</footer>
  </body>
</html>
