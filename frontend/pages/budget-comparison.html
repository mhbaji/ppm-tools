<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Bandingkan anggaran berdasarkan tahapan dan jenis tagging.">
    <title>Perbandingan Anggaran | PPM Tools</title>
    <link rel="stylesheet" href="/css/apbd.css?v=27">
    <script src="/js/export-dialog.js?v=1" defer></script>
    <script src="/js/excel-export.js?v=1" defer></script>
    <script src="/js/budget-comparison.js?v=8" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="PPM Tools">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span><strong>PPM Tools</strong><small>Portal data publik</small></span>
      </a>
      <nav class="public-navigation" aria-label="Navigasi publik">
        <a class="button button-secondary" href="/">Dashboard</a>
        <a class="button button-secondary" href="/tagging">Tagging</a>
        <a class="button button-secondary" href="/realisasi">Realisasi dan Capaian</a>
        <a class="button button-secondary" href="/tautan">Tautan</a>
        <a class="button button-secondary" href="/perbandingan-anggaran" aria-current="page">Perbandingan Anggaran</a>
        <a class="button button-secondary" href="/login">Admin</a>
      </nav>
    </header>

    <main class="page-shell">
      <section class="page-heading" aria-labelledby="page-title">
        <div class="page-title-row">
          <h1 id="page-title">Perbandingan Anggaran</h1>
        </div>
        <p id="comparison-status" class="helper-text" role="status">Memuat pilihan perbandingan...</p>
      </section>

      <section class="panel comparison-panel" aria-labelledby="comparison-selection-title">
        <div class="comparison-toolbar">
          <div>
            <h2 id="comparison-selection-title">Sumber perbandingan</h2>
            <p class="helper-text">Pilih tahun dan tahapan/tagging secara terpisah untuk setiap kolom.</p>
          </div>
          <div class="comparison-selection-actions">
            <button id="comparison-add" class="button button-secondary" type="button">Tambah perbandingan</button>
            <button id="comparison-submit" class="button button-primary" type="button" disabled>
              Tampilkan perbandingan
            </button>
          </div>
        </div>
        <div id="comparison-selections" class="comparison-selections"></div>
      </section>

      <section class="panel comparison-panel" aria-labelledby="comparison-table-title">
        <div class="comparison-toolbar">
          <div>
            <h2 id="comparison-table-title">Rincian perbandingan</h2>
            <p id="comparison-count" class="helper-text"></p>
          </div>
          <div class="comparison-detail-actions">
            <button id="comparison-toggle-all" class="button button-secondary" type="button" disabled>
              Buka semua rincian
            </button>
            <label class="hierarchy-level-filter">
              Tampilkan hingga
              <select id="comparison-level-filter" class="select-control compact-select">
                <option value="skpd">SKPD</option>
                <option value="program">Program</option>
                <option value="kegiatan">Kegiatan</option>
                <option value="sub_kegiatan">Subkegiatan</option>
                <option value="kelompok" selected>Paket/Kelompok</option>
              </select>
            </label>
          </div>
          <form id="comparison-search-form" class="comparison-search-form" role="search">
            <label class="visually-hidden" for="comparison-search">Cari rincian anggaran</label>
            <input id="comparison-search" class="text-control" type="search"
              placeholder="Cari kode, SKPD, program, kegiatan..." autocomplete="off">
            <button id="comparison-search-button" class="button button-primary" type="submit">Cari</button>
            <button id="comparison-clear-search" class="button button-secondary" type="button" hidden>Hapus</button>
            <button id="comparison-export-excel" class="button button-export" type="button" disabled>Excel</button>
            <button id="comparison-export-pdf" class="button button-export" type="button" disabled
              title="Buka dialog cetak; pilih Simpan sebagai PDF">PDF</button>
          </form>
        </div>
        <div id="comparison-table-status" class="table-status" role="status"></div>
        <div id="comparison-table-wrap" class="comparison-table-wrap" hidden>
          <table class="comparison-table">
            <thead id="comparison-head"></thead>
            <tbody id="comparison-rows"></tbody>
          </table>
        </div>
        <nav id="comparison-pagination" class="pagination-controls" aria-label="Halaman perbandingan anggaran" hidden>
          <div class="page-navigation">
            <span id="comparison-page-indicator" class="helper-text"></span>
            <button id="comparison-previous" class="button button-secondary" type="button" disabled>
              Sebelumnya
            </button>
            <button id="comparison-next" class="button button-secondary" type="button" disabled>
              Berikutnya
            </button>
          </div>
        </nav>
      </section>
    </main>
    <footer class="site-footer">Perbandingan anggaran APBD</footer>
  </body>
</html>
